# LiteLLM 网关：xiaozhi-server 只认 lulu-chat / lulu-vision 两个名字，
# 背后接哪个模型在这里改，改完 docker compose restart litellm 即可，噜噜固件不用动。
model_list:
  # ---- 测试期：云 API（任选一个；模型名部署前要按各家最新文档核对）----
  - model_name: lulu-chat
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
      # 聊天不需要深度思考：压低思考量，省延迟也省 token（否则思考会吃光 max_tokens，回答为空）
      reasoning_effort: minimal
  - model_name: lulu-vision
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
      # 聊天不需要深度思考：压低思考量，省延迟也省 token（否则思考会吃光 max_tokens，回答为空）
      reasoning_effort: minimal
  # 通义千问（阿里云百炼国际版，新加坡）：把上面两个 Gemini 注释掉，打开这两个
