litellm_settings:
  drop_params: true
  request_timeout: 30
  # 云模型挂了自动切到备用（两个都配上时打开）
  # fallbacks: [{"lulu-chat": ["lulu-chat-backup"]}]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
