# 噜噜自建后端配置（覆盖 xiaozhi-esp32-server 默认 config.yaml 中的同名项）
# 启动时由 entrypoint.sh 把 ${变量} 换成 .env 里的值，生成 data/.config.yaml
# 所有密钥都从环境变量读，不写进文件：见 .env.example
# 带 <...> 的地方部署时替换。

server:
  ip: 0.0.0.0
  port: 8000
  http_port: 8003
  # OTA 接口下发给噜噜的地址，换成服务器公网 IP 或域名
  websocket: ws://<服务器IP>:8000/xiaozhi/v1/
  # 拍照看图。后端有硬开关（overlay/lulu_app.py）：用户原话里没有明确的拍照指令就拒绝拍照
  vision_explain: http://<服务器IP>:8003/mcp/vision/explain
  auth:
    # 测试期先关；上线前打开并配置设备白名单
    enabled: false

selected_module:
  VAD: SileroVAD
  ASR: ElevenLabsASR
  LLM: GatewayLLM
  VLLM: GatewayVLLM
  TTS: ElevenLabsTTS
  Memory: mem_local_short
  Intent: function_call

# 儿童说话停顿多，句尾静音判定放长，避免把半句话切掉
VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 800

ASR:
  ElevenLabsASR:
    type: elevenlabs
    api_key: ${ELEVENLABS_API_KEY}
    model_name: scribe_v1
    # 留空=自动判断语言（中文、高棉语、英语都能认）；固定 khm 时说中文会被硬识别成高棉语
    language: ""
    output_dir: tmp/

# 只留放音乐（handle_exit_intent、play_music 系统默认加载），去掉天气、新闻、联网搜索、换角色：
# 发给大模型的工具说明更短，回答更快
Intent:
  function_call:
    type: function_call
    functions: []

# 本地记忆：每轮对话结束后让大模型总结要点，存在服务器 data/.memory.yaml（不上传第三方记忆服务）。
# 清空这个文件即可让噜噜忘掉。重建容器前要把它挂到宿主机上，不然会丢
Memory:
  mem_local_short:
    type: mem_local_short
    llm: GatewayLLM

# 大模型和视觉模型都走 LiteLLM 网关，换模型只改 gateway/litellm.yaml
LLM:
  GatewayLLM:
    type: openai
    base_url: http://litellm:4000/v1
    model_name: lulu-chat
    api_key: ${LITELLM_MASTER_KEY}
    temperature: 0.7
    # Gemini 3 等思考型模型会先用掉一部分额度做“思考”，300 太小会导致回答为空；
    # 回答长短靠提示词控制（两三句话）
    max_tokens: 1500

VLLM:
  GatewayVLLM:
    type: openai
    url: http://litellm:4000/v1
    model_name: lulu-vision
    api_key: ${LITELLM_MASTER_KEY}

TTS:
  ElevenLabsTTS:
    type: elevenlabs
    api_key: ${ELEVENLABS_API_KEY}
    # 测试期先用 ElevenLabs 自带音色 Jessica（premade，免费账号可用；音色库里的声音免费账号调接口会返回 402）
    voice_id: cgSgspJ2msm6clMCkdW9
    # 中文、英语用 ElevenLabs 快速模型；高棉文字改用微软 Edge 高棉语女声（ElevenLabs 念高棉语听不懂）
    model_id: eleven_flash_v2_5
    khmer_voice: km-KH-SreymomNeural
    output_dir: tmp/

prompt: |
  你叫噜噜，是一只住在柬埔寨小朋友家里的小机器狗，正在陪 3 到 8 岁的孩子聊天和学习。
  [说话规则]
  - 默认对方说什么语言就用什么语言回答（高棉语、中文、英语），用简单口语，每次不超过两三句话。工具返回的内容也要用对方的语言转述。
  - 说中文时一律用普通话和简体字，不用粤语、不写粤语字（唔、嘅、咩、佢、啲），即使识别出来的文字像粤语，也当作普通话理解并用普通话回答。
  - 你是女孩子，说高棉语时用“ចាស”应答，不要写成“បាទ/ចាស”。
  - 对方明确要求用某种语言（比如“用高棉语跟我说”“说高棉语”），就马上换成那种语言，并且一直用下去，直到对方要求换回来。
  - 语气温柔、活泼、有耐心，多鼓励，孩子答错时温和地提示，再让孩子试一次。
  - 不讲吓人、暴力、成人话题；遇到危险问题（火、电、陌生人、药品），提醒孩子去找爸爸妈妈。
  - 不询问也不记住孩子的住址、电话、学校等隐私信息。
  [听写纠错]
  - 你收到的是语音识别出来的文字，可能有同音错字（比如“高棉语”被写成“高棉鱼”，“噜噜”写成“露露”）。按最合理的意思理解，不要纠结字面；实在听不懂就简单问一句。
  [互动]
  - 只有对方明确让你看东西或拍照时（比如“看看这是什么”“拍张照”“look at this”“មើលនេះ”），才调用拍照工具；打招呼、聊天时绝对不要拍照。拍照后用一句话说出看到的东西，再问一个简单的小问题（颜色、数量、名字）。
  - 适合的时候调用动作工具（打招呼、坐下、摇头晃脑等）让对话更生动，但不要每句话都动。
